<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flores Pixel Art</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

/* ===================================================
   TAMAÑO DE CADA FLOR
   Cambia el valor px de la flor que quieras ajustar.
   Valores recomendados: entre 6px y 20px.
=================================================== */
:root {
  --rosa:     9px;   /* Rosa            */
  --girasol:  9px;   /* Girasol         */
  --tulipan:  9px;   /* Tulipán         */
  --lavanda:  9px;   /* Lavanda         */
  --margarita:9px;   /* Margarita       */
  --azul:     9px;   /* Flor azul       */
  --naranja:  9px;   /* Flor naranja    */
}

#canvas{
  width:100%;
  min-height:100vh;
  background:#1a1a2e;
  padding:32px 16px 40px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:48px;
  align-items:flex-end;
}
.f{position:relative;flex-shrink:0}
.f::before{content:"";position:absolute}

/* — Rosa — */
.rosa{width:var(--rosa);height:var(--rosa)}
.rosa::before{width:var(--rosa);height:var(--rosa);box-shadow:
  calc(2*var(--rosa)) calc(0*var(--rosa)) #f48fb1,
  calc(1*var(--rosa)) calc(1*var(--rosa)) #f06292,
  calc(2*var(--rosa)) calc(1*var(--rosa)) #ec407a,
  calc(3*var(--rosa)) calc(1*var(--rosa)) #f06292,
  calc(0*var(--rosa)) calc(2*var(--rosa)) #f48fb1,
  calc(1*var(--rosa)) calc(2*var(--rosa)) #ec407a,
  calc(2*var(--rosa)) calc(2*var(--rosa)) #ffffff,
  calc(3*var(--rosa)) calc(2*var(--rosa)) #ec407a,
  calc(4*var(--rosa)) calc(2*var(--rosa)) #f48fb1,
  calc(1*var(--rosa)) calc(3*var(--rosa)) #f06292,
  calc(2*var(--rosa)) calc(3*var(--rosa)) #ec407a,
  calc(3*var(--rosa)) calc(3*var(--rosa)) #f06292,
  calc(2*var(--rosa)) calc(4*var(--rosa)) #f48fb1,
  calc(2*var(--rosa)) calc(5*var(--rosa)) #4caf50,
  calc(1*var(--rosa)) calc(6*var(--rosa)) #43a047,
  calc(2*var(--rosa)) calc(6*var(--rosa)) #4caf50,
  calc(2*var(--rosa)) calc(7*var(--rosa)) #388e3c,
  calc(2*var(--rosa)) calc(8*var(--rosa)) #388e3c,
  calc(2*var(--rosa)) calc(9*var(--rosa)) #2e7d32,
  calc(2*var(--rosa)) calc(10*var(--rosa)) #2e7d32}

/* — Girasol — */
.girasol{width:var(--girasol);height:var(--girasol)}
.girasol::before{width:var(--girasol);height:var(--girasol);box-shadow:
  calc(2*var(--girasol)) calc(0*var(--girasol)) #fdd835,
  calc(1*var(--girasol)) calc(1*var(--girasol)) #fdd835,
  calc(2*var(--girasol)) calc(1*var(--girasol)) #fdd835,
  calc(3*var(--girasol)) calc(1*var(--girasol)) #fdd835,
  calc(0*var(--girasol)) calc(2*var(--girasol)) #fdd835,
  calc(1*var(--girasol)) calc(2*var(--girasol)) #f9a825,
  calc(2*var(--girasol)) calc(2*var(--girasol)) #5d4037,
  calc(3*var(--girasol)) calc(2*var(--girasol)) #f9a825,
  calc(4*var(--girasol)) calc(2*var(--girasol)) #fdd835,
  calc(0*var(--girasol)) calc(3*var(--girasol)) #fdd835,
  calc(1*var(--girasol)) calc(3*var(--girasol)) #f9a825,
  calc(2*var(--girasol)) calc(3*var(--girasol)) #4e342e,
  calc(3*var(--girasol)) calc(3*var(--girasol)) #f9a825,
  calc(4*var(--girasol)) calc(3*var(--girasol)) #fdd835,
  calc(1*var(--girasol)) calc(4*var(--girasol)) #fdd835,
  calc(2*var(--girasol)) calc(4*var(--girasol)) #fdd835,
  calc(3*var(--girasol)) calc(4*var(--girasol)) #fdd835,
  calc(2*var(--girasol)) calc(5*var(--girasol)) #66bb6a,
  calc(2*var(--girasol)) calc(6*var(--girasol)) #4caf50,
  calc(1*var(--girasol)) calc(7*var(--girasol)) #43a047,
  calc(2*var(--girasol)) calc(7*var(--girasol)) #388e3c,
  calc(2*var(--girasol)) calc(8*var(--girasol)) #388e3c,
  calc(3*var(--girasol)) calc(8*var(--girasol)) #43a047,
  calc(2*var(--girasol)) calc(9*var(--girasol)) #2e7d32,
  calc(2*var(--girasol)) calc(10*var(--girasol)) #2e7d32}

/* — Tulipán — */
.tulipan{width:var(--tulipan);height:var(--tulipan)}
.tulipan::before{width:var(--tulipan);height:var(--tulipan);box-shadow:
  calc(2*var(--tulipan)) calc(0*var(--tulipan)) #ef5350,
  calc(1*var(--tulipan)) calc(1*var(--tulipan)) #e53935,
  calc(2*var(--tulipan)) calc(1*var(--tulipan)) #ef9a9a,
  calc(3*var(--tulipan)) calc(1*var(--tulipan)) #e53935,
  calc(1*var(--tulipan)) calc(2*var(--tulipan)) #e53935,
  calc(2*var(--tulipan)) calc(2*var(--tulipan)) #ffcdd2,
  calc(3*var(--tulipan)) calc(2*var(--tulipan)) #ef5350,
  calc(1*var(--tulipan)) calc(3*var(--tulipan)) #c62828,
  calc(2*var(--tulipan)) calc(3*var(--tulipan)) #ef5350,
  calc(3*var(--tulipan)) calc(3*var(--tulipan)) #c62828,
  calc(2*var(--tulipan)) calc(4*var(--tulipan)) #c62828,
  calc(2*var(--tulipan)) calc(5*var(--tulipan)) #558b2f,
  calc(1*var(--tulipan)) calc(6*var(--tulipan)) #558b2f,
  calc(2*var(--tulipan)) calc(6*var(--tulipan)) #33691e,
  calc(3*var(--tulipan)) calc(6*var(--tulipan)) #558b2f,
  calc(2*var(--tulipan)) calc(7*var(--tulipan)) #33691e,
  calc(2*var(--tulipan)) calc(8*var(--tulipan)) #33691e,
  calc(2*var(--tulipan)) calc(9*var(--tulipan)) #1b5e20,
  calc(2*var(--tulipan)) calc(10*var(--tulipan)) #1b5e20}

/* — Lavanda — */
.lavanda{width:var(--lavanda);height:var(--lavanda)}
.lavanda::before{width:var(--lavanda);height:var(--lavanda);box-shadow:
  calc(2*var(--lavanda)) calc(0*var(--lavanda)) #ce93d8,
  calc(1*var(--lavanda)) calc(1*var(--lavanda)) #ba68c8,
  calc(2*var(--lavanda)) calc(1*var(--lavanda)) #e1bee7,
  calc(3*var(--lavanda)) calc(1*var(--lavanda)) #ba68c8,
  calc(1*var(--lavanda)) calc(2*var(--lavanda)) #ab47bc,
  calc(2*var(--lavanda)) calc(2*var(--lavanda)) #ce93d8,
  calc(3*var(--lavanda)) calc(2*var(--lavanda)) #ab47bc,
  calc(2*var(--lavanda)) calc(3*var(--lavanda)) #9c27b0,
  calc(1*var(--lavanda)) calc(3*var(--lavanda)) #ba68c8,
  calc(3*var(--lavanda)) calc(3*var(--lavanda)) #ba68c8,
  calc(2*var(--lavanda)) calc(4*var(--lavanda)) #9c27b0,
  calc(2*var(--lavanda)) calc(5*var(--lavanda)) #558b2f,
  calc(2*var(--lavanda)) calc(6*var(--lavanda)) #4caf50,
  calc(1*var(--lavanda)) calc(7*var(--lavanda)) #43a047,
  calc(2*var(--lavanda)) calc(7*var(--lavanda)) #388e3c,
  calc(2*var(--lavanda)) calc(8*var(--lavanda)) #2e7d32,
  calc(2*var(--lavanda)) calc(9*var(--lavanda)) #1b5e20,
  calc(2*var(--lavanda)) calc(10*var(--lavanda)) #1b5e20}

/* — Margarita — */
.margarita{width:var(--margarita);height:var(--margarita)}
.margarita::before{width:var(--margarita);height:var(--margarita);box-shadow:
  calc(2*var(--margarita)) calc(0*var(--margarita)) #ffffff,
  calc(1*var(--margarita)) calc(1*var(--margarita)) #f5f5f5,
  calc(2*var(--margarita)) calc(1*var(--margarita)) #fdd835,
  calc(3*var(--margarita)) calc(1*var(--margarita)) #f5f5f5,
  calc(0*var(--margarita)) calc(2*var(--margarita)) #ffffff,
  calc(1*var(--margarita)) calc(2*var(--margarita)) #fdd835,
  calc(2*var(--margarita)) calc(2*var(--margarita)) #f9a825,
  calc(3*var(--margarita)) calc(2*var(--margarita)) #fdd835,
  calc(4*var(--margarita)) calc(2*var(--margarita)) #ffffff,
  calc(1*var(--margarita)) calc(3*var(--margarita)) #f5f5f5,
  calc(2*var(--margarita)) calc(3*var(--margarita)) #fdd835,
  calc(3*var(--margarita)) calc(3*var(--margarita)) #f5f5f5,
  calc(2*var(--margarita)) calc(4*var(--margarita)) #ffffff,
  calc(2*var(--margarita)) calc(5*var(--margarita)) #66bb6a,
  calc(2*var(--margarita)) calc(6*var(--margarita)) #4caf50,
  calc(1*var(--margarita)) calc(7*var(--margarita)) #43a047,
  calc(2*var(--margarita)) calc(7*var(--margarita)) #388e3c,
  calc(3*var(--margarita)) calc(7*var(--margarita)) #43a047,
  calc(2*var(--margarita)) calc(8*var(--margarita)) #388e3c,
  calc(2*var(--margarita)) calc(9*var(--margarita)) #2e7d32,
  calc(2*var(--margarita)) calc(10*var(--margarita)) #1b5e20}

/* — Flor azul — */
.azul{width:var(--azul);height:var(--azul)}
.azul::before{width:var(--azul);height:var(--azul);box-shadow:
  calc(2*var(--azul)) calc(0*var(--azul)) #90caf9,
  calc(1*var(--azul)) calc(1*var(--azul)) #64b5f6,
  calc(2*var(--azul)) calc(1*var(--azul)) #e3f2fd,
  calc(3*var(--azul)) calc(1*var(--azul)) #64b5f6,
  calc(0*var(--azul)) calc(2*var(--azul)) #42a5f5,
  calc(1*var(--azul)) calc(2*var(--azul)) #90caf9,
  calc(2*var(--azul)) calc(2*var(--azul)) #ffffff,
  calc(3*var(--azul)) calc(2*var(--azul)) #90caf9,
  calc(4*var(--azul)) calc(2*var(--azul)) #42a5f5,
  calc(1*var(--azul)) calc(3*var(--azul)) #64b5f6,
  calc(2*var(--azul)) calc(3*var(--azul)) #42a5f5,
  calc(3*var(--azul)) calc(3*var(--azul)) #64b5f6,
  calc(2*var(--azul)) calc(4*var(--azul)) #1565c0,
  calc(2*var(--azul)) calc(5*var(--azul)) #558b2f,
  calc(2*var(--azul)) calc(6*var(--azul)) #4caf50,
  calc(2*var(--azul)) calc(7*var(--azul)) #388e3c,
  calc(1*var(--azul)) calc(8*var(--azul)) #2e7d32,
  calc(2*var(--azul)) calc(8*var(--azul)) #388e3c,
  calc(2*var(--azul)) calc(9*var(--azul)) #1b5e20,
  calc(2*var(--azul)) calc(10*var(--azul)) #1b5e20}

/* — Flor naranja — */
.naranja{width:var(--naranja);height:var(--naranja)}
.naranja::before{width:var(--naranja);height:var(--naranja);box-shadow:
  calc(1*var(--naranja)) calc(0*var(--naranja)) #ffcc02,
  calc(2*var(--naranja)) calc(0*var(--naranja)) #ff9800,
  calc(3*var(--naranja)) calc(0*var(--naranja)) #ffcc02,
  calc(0*var(--naranja)) calc(1*var(--naranja)) #ff9800,
  calc(1*var(--naranja)) calc(1*var(--naranja)) #ffb74d,
  calc(2*var(--naranja)) calc(1*var(--naranja)) #ffe082,
  calc(3*var(--naranja)) calc(1*var(--naranja)) #ffb74d,
  calc(4*var(--naranja)) calc(1*var(--naranja)) #ff9800,
  calc(0*var(--naranja)) calc(2*var(--naranja)) #ff9800,
  calc(1*var(--naranja)) calc(2*var(--naranja)) #ffe082,
  calc(2*var(--naranja)) calc(2*var(--naranja)) #ffffff,
  calc(3*var(--naranja)) calc(2*var(--naranja)) #ffe082,
  calc(4*var(--naranja)) calc(2*var(--naranja)) #ff9800,
  calc(1*var(--naranja)) calc(3*var(--naranja)) #ffb74d,
  calc(2*var(--naranja)) calc(3*var(--naranja)) #ff9800,
  calc(3*var(--naranja)) calc(3*var(--naranja)) #ffb74d,
  calc(1*var(--naranja)) calc(4*var(--naranja)) #ff9800,
  calc(2*var(--naranja)) calc(4*var(--naranja)) #ff6f00,
  calc(3*var(--naranja)) calc(4*var(--naranja)) #ff9800,
  calc(2*var(--naranja)) calc(5*var(--naranja)) #66bb6a,
  calc(2*var(--naranja)) calc(6*var(--naranja)) #4caf50,
  calc(2*var(--naranja)) calc(7*var(--naranja)) #388e3c,
  calc(2*var(--naranja)) calc(8*var(--naranja)) #388e3c,
  calc(1*var(--naranja)) calc(9*var(--naranja)) #2e7d32,
  calc(2*var(--naranja)) calc(9*var(--naranja)) #2e7d32,
  calc(3*var(--naranja)) calc(9*var(--naranja)) #43a047,
  calc(2*var(--naranja)) calc(10*var(--naranja)) #1b5e20}
</style>
</head>
<body>
<div id="canvas">
  <div class="f rosa"></div>
  <div class="f girasol"></div>
  <div class="f tulipan"></div>
  <div class="f lavanda"></div>
  <div class="f margarita"></div>
  <div class="f azul"></div>
  <div class="f naranja"></div>
</div>
</body>
</html>
