<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .zorro-pixel {
            
            --pixel: 8px;
            --row-fix: 1px;

            --outline: #2b1a13;
            --orange: #fc9700;
            --orange-shadow: #db6600;
            --fur: #ffffff;
            --fur-shadow: #d4d4d4;

            width: 24em;
            height: 24em;
            font-size: var(--pixel);

            image-rendering: pixelated;
            background-repeat: no-repeat;

            background:
            linear-gradient(to right, transparent 0em 3em, var(--outline) 3em 4em, transparent 4em 24em) 0 0em / 24em 1em no-repeat,
            linear-gradient(to right, transparent 0em 2em, var(--outline) 2em 3em, var(--fur) 3em 4em, var(--outline) 4em 5em, transparent 5em 13em, var(--outline) 13em 16em, transparent 16em 24em) 0 1em / 24em 1em no-repeat,
            linear-gradient(to right, transparent 0em 2em, var(--outline) 2em 3em, var(--fur) 3em 4em, var(--orange) 4em 5em, var(--outline) 5em 6em, transparent 6em 10em, var(--outline) 10em 13em, var(--orange-shadow) 13em 14em, var(--fur) 14em 15em, var(--outline) 15em 16em, transparent 16em 24em) 0 2em / 24em 1em no-repeat,
            linear-gradient(to right, transparent 0em 2em, var(--outline) 2em 3em, var(--fur-shadow) 3em 4em, var(--orange) 4em 6em, var(--outline) 6em 10em, var(--orange-shadow) 10em 13em, var(--fur) 13em 15em, var(--outline) 15em 16em, transparent 16em 24em) 0 3em / 24em 1em no-repeat,
            linear-gradient(to right, transparent 0em 2em, var(--outline) 2em 3em, var(--fur-shadow) 3em 4em, var(--outline) 4em 6em, var(--orange-shadow) 6em 10em, var(--outline) 10em 13em, var(--fur) 13em 14em, var(--outline) 14em 15em, transparent 15em 24em) 0 4em / 24em 1em no-repeat,
            linear-gradient(to right, transparent 0em 2em, var(--outline) 2em 4em, var(--orange-shadow) 4em 6em, var(--orange) 6em 12em, var(--orange-shadow) 12em 13em, var(--outline) 13em 15em, transparent 15em 24em) 0 5em / 24em 1em no-repeat,
            linear-gradient(to right, transparent 0em 2em, var(--outline) 2em 3em, var(--orange-shadow) 3em 5em, var(--orange) 5em 14em, var(--outline) 14em 15em, transparent 15em 24em) 0 6em / 24em 1em no-repeat,
            linear-gradient(to right, transparent 0em 2em, var(--outline) 2em 3em, var(--orange-shadow) 3em 4em, var(--orange) 4em 5em, var(--outline) 5em 6em, var(--orange) 6em 10em, var(--outline) 10em 11em, var(--orange) 11em 14em, var(--outline) 14em 15em, transparent 15em 24em) 0 7em / 24em 1em no-repeat,
            linear-gradient(to right, transparent 0em 1em, var(--outline) 1em 2em, var(--fur-shadow) 2em 3em, var(--orange-shadow) 3em 4em, var(--orange) 4em 5em, var(--outline) 5em 6em, var(--orange) 6em 10em, var(--outline) 10em 11em, var(--orange) 11em 13em, var(--fur) 13em 15em, var(--outline) 15em 16em, transparent 16em 24em) 0 8em / 24em 1em no-repeat,
            linear-gradient(to right, transparent 0em 1em, var(--outline) 1em 2em, var(--fur-shadow) 2em 3em, var(--fur) 3em 7em, var(--outline) 7em 9em, var(--fur) 9em 15em, var(--outline) 15em 16em, transparent 16em 24em) 0 9em / 24em 1em no-repeat,
            linear-gradient(to right, var(--outline) 0em 1em, var(--fur-shadow) 1em 4em, var(--fur) 4em 16em, var(--outline) 16em 17em, transparent 17em 24em) 0 10em / 24em 1em no-repeat,
            linear-gradient(to right, transparent 0em 1em, var(--outline) 1em 3em, var(--fur-shadow) 3em 6em, var(--fur) 6em 14em, var(--outline) 14em 16em, transparent 16em 24em) 0 11em / 24em 1em no-repeat,
            linear-gradient(to right, transparent 0em 3em, var(--outline) 3em 14em, transparent 14em 24em) 0 12em / 24em 1em no-repeat,
            linear-gradient(to right, transparent 0em 5em, var(--outline) 5em 6em, var(--orange-shadow) 6em 7em, var(--fur-shadow) 7em 9em, var(--orange-shadow) 9em 10em, var(--outline) 10em 11em, transparent 11em 20em, var(--outline) 20em 24em) 0 13em / 24em 1em no-repeat,
            linear-gradient(to right, transparent 0em 4em, var(--outline) 4em 5em, var(--orange-shadow) 5em 6em, var(--fur-shadow) 6em 7em, var(--fur) 7em 10em, var(--orange-shadow) 10em 11em, var(--outline) 11em 13em, transparent 13em 18em, var(--outline) 18em 20em, var(--fur) 20em 23em, var(--outline) 23em 24em) 0 14em / 24em 1em no-repeat,
            linear-gradient(to right, transparent 0em 4em, var(--outline) 4em 5em, var(--orange-shadow) 5em 6em, var(--fur-shadow) 6em 7em, var(--fur) 7em 10em, var(--orange) 10em 11em, var(--outline) 11em 13em, transparent 13em 17em, var(--outline) 17em 18em, var(--orange) 18em 19em, var(--fur) 19em 23em, var(--outline) 23em 24em) 0 15em / 24em 1em no-repeat,
            linear-gradient(to right, transparent 0em 3em, var(--outline) 3em 4em, var(--orange-shadow) 4em 6em, var(--fur) 6em 10em, var(--orange) 10em 11em, var(--orange-shadow) 11em 13em, var(--outline) 13em 14em, transparent 14em 16em, var(--outline) 16em 17em, var(--orange) 17em 20em, var(--fur) 20em 22em, var(--fur-shadow) 22em 23em, var(--outline) 23em 24em) 0 16em / 24em 1em no-repeat,
            linear-gradient(to right, transparent 0em 3em, var(--outline) 3em 4em, var(--orange-shadow) 4em 5em, var(--outline) 5em 6em, var(--fur) 6em 10em, var(--outline) 10em 11em, var(--orange) 11em 12em, var(--orange-shadow) 12em 13em, var(--outline) 13em 14em, transparent 14em 16em, var(--outline) 16em 17em, var(--orange) 17em 21em, var(--orange-shadow) 21em 22em, var(--outline) 22em 23em, transparent 23em 24em) 0 17em / 24em 1em no-repeat,
            linear-gradient(to right, transparent 0em 3em, var(--outline) 3em 4em, var(--orange-shadow) 4em 5em, var(--outline) 5em 6em, var(--fur) 6em 10em, var(--outline) 10em 11em, var(--orange) 11em 12em, var(--orange-shadow) 12em 13em, var(--outline) 13em 14em, transparent 14em 15em, var(--outline) 15em 16em, var(--orange) 16em 20em, var(--orange-shadow) 20em 22em, var(--outline) 22em 23em, transparent 23em 24em) 0 18em / 24em 1em no-repeat,
            linear-gradient(to right, transparent 0em 3em, var(--outline) 3em 4em, var(--orange-shadow) 4em 5em, var(--outline) 5em 6em, var(--fur) 6em 10em, var(--outline) 10em 11em, var(--orange) 11em 12em, var(--orange-shadow) 12em 13em, var(--outline) 13em 14em, transparent 14em 15em, var(--outline) 15em 16em, var(--orange) 16em 18em, var(--orange-shadow) 18em 21em, var(--outline) 21em 22em, transparent 22em 24em) 0 19em / 24em 1em no-repeat,
            linear-gradient(to right, transparent 0em 2em, var(--outline) 2em 3em, var(--orange-shadow) 3em 5em, var(--outline) 5em 6em, var(--fur-shadow) 6em 7em, var(--fur) 7em 10em, var(--outline) 10em 11em, var(--orange) 11em 14em, var(--outline) 14em 15em, var(--orange) 15em 16em, var(--orange-shadow) 16em 19em, var(--outline) 19em 21em, transparent 21em 24em) 0 20em / 24em 1em no-repeat,
            linear-gradient(to right, transparent 0em 2em, var(--outline) 2em 3em, var(--orange-shadow) 3em 5em, var(--outline) 5em 6em, var(--fur-shadow) 6em 7em, var(--fur) 7em 10em, var(--outline) 10em 11em, var(--orange-shadow) 11em 12em, var(--orange) 12em 14em, var(--outline) 14em 15em, var(--orange-shadow) 15em 17em, var(--outline) 17em 19em, transparent 19em 24em) 0 21em / 24em 1em no-repeat,
            linear-gradient(to right, transparent 0em 3em, var(--outline) 3em 4em, var(--orange-shadow) 4em 6em, var(--outline) 6em 7em, var(--fur-shadow) 7em 8em, var(--fur) 8em 9em, var(--outline) 9em 10em, var(--orange-shadow) 10em 13em, var(--outline) 13em 14em, var(--orange-shadow) 14em 15em, var(--outline) 15em 17em, transparent 17em 24em) 0 22em / 24em 1em no-repeat,
            linear-gradient(to right, transparent 0em 4em, var(--outline) 4em 15em, transparent 15em 24em) 0 23em / 24em 1em no-repeat;
        }
    </style>
</head>
<body>
    <div class="zorro-pixel"></div>
</body>
</html>
